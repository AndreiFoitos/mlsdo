variables:
  VM_USER: "warpgate"
  POSTGRES_URL: "postgresql://postgres:pw1@localhost:5432/reviews_db"

image: finalgene/openssh

stages:
  - build
  - setup
  - update
  - lint
  - test
  - training
  - deploy

.update_app_image:
  before_script:
    - ssh $CI_SSH_HOST "sudo docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY"
    - ssh $CI_SSH_HOST "sudo docker pull $CI_REGISTRY_IMAGE:app-latest"

.sync_and_install:
  before_script:
    - 'which rsync || ( apk add --update rsync )'
    - ssh "$CI_SSH_HOST" "sudo mkdir -p /home/$VM_USER/app && sudo chown $VM_USER:$VM_USER /home/$VM_USER/app"
    - rsync -rtz --delete --exclude 'volumes' --exclude 'venv' --exclude '.git' --exclude '__pycache__' --exclude '*.pyc' --exclude 'node_modules' . "$CI_SSH_HOST":/home/$VM_USER/app
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && [ ! -d venv ] && python3 -m venv venv || true"
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && source venv/bin/activate && pip install --upgrade pip"
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && source venv/bin/activate && pip install -r requirements.txt"

build_app:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:app-latest" -f backend/api/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE:app-latest"
  rules:
    - changes:
        - backend/api/**
        - backend/inference/**
        - environment.yml

setup_infra:
  stage: setup
  before_script:
    - !reference [.sync_and_install, before_script]
  script:
    - |
      ssh $CI_SSH_HOST "
        cd /home/$VM_USER/app &&
        cat <<EOF > .env
        GITLAB_TRIGGER_TOKEN=$GITLAB_TRIGGER_TOKEN
        GITLAB_PROJECT_ID=$GITLAB_PROJECT_ID
        GITLAB_REF=$GITLAB_REF
        MLFLOW_MODEL_NAME=$MLFLOW_MODEL_NAME
        EOF
      "
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && sudo docker compose down && sudo docker compose up -d"
  rules:
    - when: always

update_data:
  stage: update
  before_script:
    - !reference [.sync_and_install, before_script]
  script:
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && source venv/bin/activate && export POSTGRES_URL='$POSTGRES_URL' && export CSV_PATH='data/issue_with_labels.csv' && python3 data/preprocessing/ppl-load_data.py"
  rules:
    - changes:
        - data/preprocessing/**
        - data/issue_with_labels.csv

lint_code:
  stage: lint
  before_script:
    - !reference [.sync_and_install, before_script]
  script:
    - |
      ssh $CI_SSH_HOST "
        cd /home/$VM_USER/app &&
        source venv/bin/activate &&
        pip install pylint &&
        pylint backend/api backend/inference --fail-under=8.0
      "
  rules:
    - if: '$CI_COMMIT_BRANCH=="develop"'
    - changes:
        - backend/api/**
        - backend/inference/**

run_tests:
  stage: test
  before_script:
    - !reference [.sync_and_install, before_script]
  script:
    - |
      ssh $CI_SSH_HOST "
        cd /home/$VM_USER/app &&
        source venv/bin/activate &&
        pip install pytest pytest-mock &&
        pytest tests --maxfail=1 --disable-warnings
      "
  rules:
    - if: '$CI_COMMIT_BRANCH=="develop"'
    - when: always

train_model:
  stage: training
  before_script:
    - !reference [.sync_and_install, before_script]
  script:
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && source venv/bin/activate && export CI_MODE=true && export POSTGRES_URL='$POSTGRES_URL' && export REDIS_URL='redis://localhost:6379/0' && export MLFLOW_TRACKING_URI='http://localhost:5000' && export MLFLOW_MODEL_NAME='$MLFLOW_MODEL_NAME' && python3 data/training/ppl-train.py"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - changes:
        - data/training/**
        - environment.yml

deploy_api:
  stage: deploy
  before_script:
    - !reference [.update_app_image, before_script]
  script:
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && sudo docker compose up -d --no-deps --build app-api"
  rules:
    - changes:
        - backend/api/**
        - backend/inference/**
        - environment.yml
