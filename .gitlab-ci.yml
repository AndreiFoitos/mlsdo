stages:
  - build
  - test        
  - setup
  - update
  - training
  - deploy

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  VM_USER: "warpgate"
  DOCKER_DRIVER: overlay2

build_app:
  stage: build
  tags:
    - docker
  image: docker:20.10.16
  services:
    - name: docker:20.10.16-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:app-latest" ./backend/api
    - docker push "$CI_REGISTRY_IMAGE:app-latest"
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'


train_model:
  stage: training
  image: python:3.11
  script:
    - cd backend || exit 1
    - pip install -r requirements.txt
    - python ../data/training/ppl-train.py

  rules:
  - changes:
      - data/**/* 
      - backend/**/* 
      - docker-compose.yml

setup_infra:
  stage: setup
  script:
    - ssh "$CI_SSH_HOST" "sudo mkdir -p /home/$VM_USER/app"
    - rsync -rtvz --delete --exclude 'volumes' . "$CI_SSH_HOST":/home/$VM_USER/app
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && sudo docker compose up -d"

deploy_api:
  stage: deploy
  script:
    - ssh $CI_SSH_HOST "sudo docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY"
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && sudo docker compose pull && sudo docker compose up -d"