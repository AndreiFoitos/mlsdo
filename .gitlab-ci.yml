variables:
  VM_USER: "warpgate"

image: finalgene/openssh

stages:
  - build
  - setup
  - update
  - training
  - deploy

.update_app_image:
  before_script:
    - ssh $CI_SSH_HOST "sudo docker login -u gitlab-ci-token -p $CI_JOB_TOKEN $CI_REGISTRY"
    - ssh $CI_SSH_HOST "sudo docker pull $CI_REGISTRY_IMAGE:app-latest"

.sync_and_install:
  before_script:
    - 'which rsync || ( apk add --update rsync )'
    - ssh "$CI_SSH_HOST" "sudo mkdir -p /home/$VM_USER/app && sudo chown $VM_USER:$VM_USER /home/$VM_USER/app"
    - rsync -rtz --delete --exclude 'volumes' --exclude 'venv' --exclude '.git' --exclude '__pycache__' --exclude '*.pyc' --exclude 'node_modules' . "$CI_SSH_HOST":/home/$VM_USER/app
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && [ ! -d venv ] && python3 -m venv venv || true"
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && source venv/bin/activate && pip install --upgrade pip"
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && source venv/bin/activate && pip install -r requirements.txt"

build_app:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login $CI_REGISTRY -u $CI_REGISTRY_USER --password-stdin
  script:
    - docker build -t "$CI_REGISTRY_IMAGE:app-latest" -f backend/api/Dockerfile .
    - docker push "$CI_REGISTRY_IMAGE:app-latest"
  rules:
    - changes:
        - backend/api/**
        - backend/inference/**
        - environment.yml

setup_infra:
  stage: setup
  before_script:
    - !reference [.sync_and_install, before_script]
  script:
    - ssh $CI_SSH_HOST "sudo docker stop mlsdo-lab5-minio-mlflow-1 || true"
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && sudo docker compose down && sudo docker compose up -d"
  rules:
    - when: always

update_data:
  stage: update
  before_script:
    - !reference [.sync_and_install, before_script]
  script:
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && source venv/bin/activate && export POSTGRES_URL='postgresql://postgres:${POSTGRES_PASSWORD}@localhost:5432/reviews_db' && export CSV_PATH='data/issue_with_labels.csv' && python3 data/preprocessing/ppl-load_data.py"
  rules:
    - changes:
        - data/preprocessing/**
        - data/issue_with_labels.csv

train_model:
  stage: training
  before_script:
    - !reference [.sync_and_install, before_script]
  script:
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && source venv/bin/activate && export POSTGRES_URL='$POSTGRES_URL' && export REDIS_URL='redis://localhost:6379/0' && export MLFLOW_TRACKING_URL='$MLFLOW_TRACKING_URL' && export MLFLOW_MODEL_NAME='$MLFLOW_MODEL_NAME' && python3 data/training/ppl-train.py"
  rules:
    - changes:
        - data/training/**
        - environment.yml

deploy_api:
  stage: deploy
  before_script:
    - !reference [.update_app_image, before_script]
  script:
    - ssh $CI_SSH_HOST "cd /home/$VM_USER/app && sudo docker compose up -d --no-deps --build app-api"
  rules:
    - changes:
        - backend/api/**
        - backend/inference/**
        - environment.yml