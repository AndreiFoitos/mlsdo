name: mlsdo-assignment
version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    networks:
      - assignment
    depends_on:
      - app-api
    logging:
      driver: "json-file"
      options:
        tag: "{{.Name}}"
  
  app-api:
    build: 
      context: .  
      dockerfile: ./backend/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - POSTGRES_URL=postgresql://postgres:pw1@postgres-ml:5432/reviews_db
      - REDIS_URL=redis://redis:6379/0
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_MODEL_NAME=add_detection_model
    networks:
      - assignment
    depends_on:
      - postgres-ml
      - redis
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        tag: "{{.Name}}"

  celery-worker:
      build: 
        context: .  
        dockerfile: ./backend/inference/Dockerfile
      command: celery -A backend.inference.tasks:celery_app worker --loglevel=info
      environment:
        - POSTGRES_URL=postgresql://postgres:pw1@postgres-ml:5432/reviews_db
        - REDIS_URL=redis://redis:6379/0
        - MLFLOW_TRACKING_URI=http://mlflow:5000
        - MLFLOW_MODEL_NAME=add_detection_model
        - MLFLOW_MODEL_VERSION=1
      networks:
        - assignment
      depends_on:
        - postgres-ml
        - redis
        - mlflow
      restart: unless-stopped
      logging:
        driver: "json-file"
        options:
          tag: "{{.Name}}"

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - assignment
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - assignment
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - assignment
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning/datasources
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - assignment
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  mlflow:
    build: ./mlflow
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_S3_ENDPOINT_URL=http://minio-mlflow:9000
      - AWS_ACCESS_KEY_ID=mlflow_access_key
      - AWS_SECRET_ACCESS_KEY=mlflow_secret_key
      - POSTGRES_URL=postgresql+psycopg2://postgres:pw2@postgres-mlflow:5432/mlflow
      - BUCKET=mlflow
    networks:
      - assignment
    depends_on:
      - postgres-mlflow
      - minio-mlflow
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres-mlflow:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: pw2
      POSTGRES_DB: mlflow
    ports:
      - "5433:5432"
    volumes:
      - postgres-mlflow-data:/var/lib/postgresql/data
    networks:
      - assignment
    restart: unless-stopped

  minio-mlflow:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=mlflow_access_key
      - MINIO_ROOT_PASSWORD=mlflow_secret_key
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - assignment
    restart: unless-stopped

  postgres-ml:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: pw1
      POSTGRES_DB: reviews_db
    ports:
      - "5432:5432"
    volumes:
      - postgres-ml-data:/var/lib/postgresql/data
    networks:
      - assignment
    restart: unless-stopped

  mongo:
    image: mongo:latest
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: my-secret-pw
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - assignment
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: mlsdo-assignment-adminer-1
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres-ml
    networks:
      - assignment
    depends_on:
      - postgres-ml
      - postgres-mlflow

  mongo-express:
    image: mongo-express:latest
    container_name: mlsdo-assignment-mongo-express-1
    restart: unless-stopped
    ports:
      - "8083:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongo
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_MONGODB_ADMINUSERNAME=root
      - ME_CONFIG_MONGODB_ADMINPASSWORD=my-secret-pw
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=pass
    networks:
      - assignment
    depends_on:
      - mongo

networks:
  assignment:
    driver: bridge

volumes:
  postgres-mlflow-data:
  postgres-ml-data:
  minio-data:
  mongo-data:
