global:
  scrape_interval: 15s 

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'app-api'
    static_configs:
      - targets: ['app-api:8080']

  - job_name: 'celery-worker'
    static_configs:
      - targets: ['celery-worker:8080']